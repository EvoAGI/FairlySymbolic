# ARC solver configuration (defaults).
#
# This file holds the DEFAULT configuration. Two ways to override per run:
#   * pass a --flag to arc_solver                  (e.g. --pop 80), or
#   * set the legacy ARC_* environment variable    (e.g. ARC_SELECTION=tournament)
# Precedence (low -> high):  built-in defaults  <  this file  <  env vars  <  --CLI flags
#
# Format: `key = value`, '#' starts a comment (whole-line or inline). Booleans
# accept true/false/1/0/yes/no/on/off. Edit values here to change the default
# behaviour; there is no need to touch the source.

# ============================ data / run source ============================
data_dir        = data/training     # per-task JSON dir (ignored when kaggle set)
kaggle          =                   # path to a Kaggle ARC-Prize dataset folder
split           = evaluation        # kaggle split: training | evaluation | test
output_root     = runs
max_tasks       = 0                 # 0 = all tasks in the split
task_offset     = 0

# ============================ search / GA params ===========================
population        = 40
generations       = 60
restarts          = 5
max_rules         = 5
seed              = 47
max_task_seconds  = 3840.0          # per-task search budget
n_workers         = 6               # process pool size (1 = serial)
fitness_target    = train           # ARC-compliant: optimise train only
fitness_distance  = graph           # graph | pixel
phase_a_shortcut  = true            # early-return when a seed already solves train

# ======================= selection / GA behaviour ==========================
# (these mirror the legacy ARC_* env flags; the file is now their home)
selection         = lexicase        # tournament | lexicase | lexicase_inject
lexicase_cases    = fine2           # coarse | fine | fine2
lex_complement    = 0               # 1 = complementary mating
lex_champions     = 0               # per-case champion carry (n)
rank_specificity  = 0               # 1 = rank by pinned-literal count among solved
stagnation_inject = 2               # generations-without-improvement before injection
stagnation_restart= 4               # generations-without-improvement before restart
diversity_gate    = 0.0             # min distinct-program fraction to gate injection

# ==================== post-solve continuations (dsl-views) =================
# All default off. Enable to run the view-ensemble / Occam experiments; they
# use leftover per-task budget after a train-solve (pass@1-invariant).
occam_continue    = 1               # 1 = depth-capped search for a shallower solver (arc-agi-long-2-v2 default)
tabu_restart      = 0               # 1 = one restart with incumbent selectors banned (measured inert)
view_continue     = 1               # 0 | 1 (=transpose,fliplr,flipud) | comma list of view names

# ============================ encoder scene cache ==========================
# Caches pickled input-scene bytes keyed by (grid, encoder-config). ~11x faster
# than re-encoding on busy grids; byte-identical results. Frees per task.
encoder_cache     = true            # on by default; --no-encoder-cache for a byte-identical baseline
encoder_cache_mb  = 1500            # per-task cache byte cap in MiB (you have >=2GB/task)

# ============================ macro library =================================
# Prior from a library of mined, role-typed macros (a JSON file). All default
# OFF: with these values the solver behaves as if the feature did not exist.
macro_library     =                 # path to mined macros.json ("" = off)
macro_rate        = 0.0             # P(realize a macro) in random_genome / add_rule mutation
macro_seed_topn   = 0               # top-N macros emitted as Phase A seeds (0 = none)
macro_seed_library=                 # separate (broader) library for Phase A seeds ("" = macro_library)
macro_mutate_rate = -1.0            # macro rate in add-rule mutation; <0 = macro_rate (byte-identical)
